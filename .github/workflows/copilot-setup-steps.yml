name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with: 
          python-version: "3.12"

      - name: Install python dependencies
        run: pip install -r requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Start dev server
        run: |
          # VitePress dev server runs on port 5173, the MCP plugin
          # starts a separate server on port 4000 automatically
          nohup npm run dev &
          # Wait for the MCP server (port 4000) to be ready
          timeout 60 bash -c 'until curl -s http://localhost:4000/mcp > /dev/null 2>&1; do sleep 2; done'
          echo "MCP server is ready on port 4000"
